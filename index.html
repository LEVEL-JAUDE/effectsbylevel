<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Effects by LEVEL — Find your level</title>
  <meta name="description" content="Effects, dialed in. Sleep, calm, focus, energy — find your level. Shop the LEVEL line." />

  <!-- Social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Effects by LEVEL" />
  <meta property="og:description" content="Effects, dialed in. Sleep · Calm · Focus · Energy. Find your level." />
  <meta property="og:url" content="https://effectsbylevel.com" />
  <meta name="theme-color" content="#0a0f1c" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Inline equalizer-bars favicon (the "levels" mark) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='14' width='5' height='15' rx='2.5' fill='%232ed9c3'/%3E%3Crect x='11' y='8' width='5' height='21' rx='2.5' fill='%2319bde8'/%3E%3Crect x='19' y='3' width='5' height='26' rx='2.5' fill='%238a84d6'/%3E%3Crect x='27' y='11' width='5' height='18' rx='2.5' fill='%23ffb548'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --teal: #2ed9c3;
      --amber: #ffb548;
      --lightblue: #19bde8;
      --green: #81e77a;
      --coral: #f68d6c;
      --periwinkle: #8a84d6;
      --red: #ff675d;
      --purple: #7473c0;
      --blue: #00a0df;
      --bg: #0a0f1c;
      --ink: #eef2fb;
      --muted: #9aa6c4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Animated aurora blobs in brand colors */
    .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; filter: blur(70px); opacity: 0.55; }
    .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; will-change: transform; }
    .b1 { width: 46vmax; height: 46vmax; background: var(--teal);       top: -14vmax; left: -10vmax;  animation: drift1 22s ease-in-out infinite; }
    .b2 { width: 40vmax; height: 40vmax; background: var(--periwinkle); bottom: -16vmax; right: -8vmax; animation: drift2 26s ease-in-out infinite; }
    .b3 { width: 34vmax; height: 34vmax; background: var(--blue);       bottom: -10vmax; left: 8vmax;   animation: drift3 30s ease-in-out infinite; }
    .b4 { width: 26vmax; height: 26vmax; background: var(--amber);      top: -6vmax; right: 14vmax;     animation: drift1 28s ease-in-out infinite reverse; }

    @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vmax,5vmax) scale(1.12); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-7vmax,-4vmax) scale(1.08); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(5vmax,-6vmax) scale(1.15); } }

    /* Subtle grain/vignette over the aurora for depth */
    .veil { position: fixed; inset: 0; z-index: 1; background:
      radial-gradient(120% 90% at 50% 8%, transparent 40%, rgba(10,15,28,0.55) 100%); }

    main {
      position: relative;
      z-index: 2;
      width: min(92vw, 680px);
      text-align: center;
      padding: 6vh 24px;
      animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    /* Equalizer "levels" mark */
    .mark { display: inline-flex; gap: 7px; align-items: flex-end; height: 46px; margin-bottom: 26px; }
    .mark span { width: 9px; border-radius: 6px; transform-origin: bottom; animation: eq 1.6s ease-in-out infinite; }
    .mark span:nth-child(1) { height: 46%;  background: var(--teal);       animation-delay: 0s; }
    .mark span:nth-child(2) { height: 78%;  background: var(--lightblue);  animation-delay: .18s; }
    .mark span:nth-child(3) { height: 100%; background: var(--periwinkle); animation-delay: .36s; }
    .mark span:nth-child(4) { height: 62%;  background: var(--amber);      animation-delay: .54s; }
    @keyframes eq { 0%,100% { transform: scaleY(0.62); } 50% { transform: scaleY(1); } }

    .eyebrow {
      font-size: clamp(11px, 2.4vw, 13px);
      font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px; padding-left: 0.42em;
    }

    h1 {
      font-weight: 900;
      font-size: clamp(56px, 16vw, 132px);
      line-height: 0.92;
      letter-spacing: -0.03em;
      background: linear-gradient(100deg, var(--teal) 0%, var(--lightblue) 38%, var(--periwinkle) 72%, var(--amber) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      margin-bottom: 18px;
    }

    .tagline {
      font-size: clamp(17px, 3.6vw, 22px);
      font-weight: 500; color: var(--ink);
      max-width: 30ch; margin: 0 auto 30px; line-height: 1.45;
    }
    .tagline b { font-weight: 800; }

    /* Effect chips */
    .effects { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 40px; }
    .chip {
      font-size: clamp(12px, 2.8vw, 14px); font-weight: 600;
      padding: 9px 18px; border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      color: color-mix(in srgb, var(--c) 80%, white);
      background: color-mix(in srgb, var(--c) 12%, transparent);
      backdrop-filter: blur(6px);
    }

    .cta {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: clamp(16px, 3.4vw, 19px); font-weight: 800; letter-spacing: -0.01em;
      color: #06121f; text-decoration: none;
      padding: 17px 34px; border-radius: 999px;
      background: linear-gradient(100deg, var(--teal), var(--lightblue) 55%, var(--periwinkle));
      box-shadow: 0 14px 40px -12px rgba(46,217,195,0.55), 0 0 0 0 rgba(255,255,255,0.5);
      transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease;
    }
    .cta:hover { transform: translateY(-3px); box-shadow: 0 22px 52px -12px rgba(25,189,232,0.6); }
    .cta:active { transform: translateY(-1px) scale(0.99); }
    .cta .arrow { transition: transform .25s ease; }
    .cta:hover .arrow { transform: translateX(4px); }

    footer {
      position: fixed; bottom: 22px; left: 0; right: 0; z-index: 2;
      text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 0.04em;
    }
    footer a { color: color-mix(in srgb, var(--teal) 75%, white); text-decoration: none; }

    @media (max-width: 480px) {
      main { padding: 4vh 18px; }
      footer { position: static; margin-top: 30px; }
      body { overflow-y: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .mark span, main { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
  </div>
  <div class="veil" aria-hidden="true"></div>

  <main>
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <p class="eyebrow">Effects by</p>
    <h1>LEVEL</h1>
    <p class="tagline">Effects, dialed in. <b>Find your level</b> — and feel exactly what you came for.</p>

    <div class="effects" aria-label="Effect categories">
      <span class="chip" style="--c: var(--periwinkle)">Sleep</span>
      <span class="chip" style="--c: var(--teal)">Calm</span>
      <span class="chip" style="--c: var(--blue)">Focus</span>
      <span class="chip" style="--c: var(--amber)">Energy</span>
    </div>

    <a class="cta" href="https://levelexperience.shop/?utm_source=effectsbylevel&utm_medium=landing&utm_campaign=funnel">
      Shop LEVEL
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <footer>
    &copy; <span id="yr">2026</span> LEVEL Experience &nbsp;·&nbsp; <a href="https://levelexperience.shop/?utm_source=effectsbylevel&utm_medium=footer">levelexperience.shop</a>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
